name: Create Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.1.0 if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists"
          else
            gh release create v1.1.0 index.html \
              --title "NER Text to Speech v1.1.0" \
              --notes "Fitur baru: tombol Simpan MP3. Unduh index.html, buka di browser, lalu tekan Simpan MP3 untuk mengunduh hasil suara."
          fi
